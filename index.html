<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIVE KEIBA SIM ARENA</title>
<style>html,body{margin:0;background:#07100b;color:#eef7f0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}#boot{padding:24px;font-size:15px}</style>
</head>
<body>
<div id="boot">FIXED49 読み込み中…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./app48.html?v=20260914-0639',{cache:'no-store'});
    if(!r.ok)throw new Error('app48 HTTP '+r.status);
    let html=await r.text();
    const tag='<scr'+'ipt src="./fixed49_patch.js?v=20260914-0639"></scr'+'ipt>';
    if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,tag+'</body>');
    else html+=tag;
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('boot').textContent='起動失敗: '+(e&&e.message?e.message:e);
  }
})();
</script>
</body>
</html>
