<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LIVE KEIBA SIM ARENA - PERIOD WEB</title><style>html,body{margin:0;background:#07100b;color:#eef7f0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}#boot{padding:24px}</style></head>
<body><div id="boot">期間仮想対戦 WEB版を読み込み中…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./index.html?v=20260914-0715',{cache:'no-store'});
    if(!r.ok)throw new Error('index HTTP '+r.status);
    let html=await r.text();
    const tags=[
      '<scr'+'ipt src="./fixed49_patch.js?v=20260914-0715"></scr'+'ipt>',
      '<scr'+'ipt src="./fixed50_patch.js?v=20260914-0715"></scr'+'ipt>',
      '<scr'+'ipt src="./fixed51_patch.js?v=20260914-0715"></scr'+'ipt>'
    ].join('');
    if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,tags+'</body>');else html+=tags;
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('boot').textContent='起動失敗: '+(e&&e.message?e.message:e)}
})();
</script></body></html>
