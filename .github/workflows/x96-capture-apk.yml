name: Build X96 Audio Capture APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'x96-translate/android-capture/**'
      - '.github/workflows/x96-capture-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools platform-tools' contains obsolete, removed 'tools'.
          packages: 'platform-tools'
      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android app
        working-directory: x96-translate/android-capture
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: X96-App-Audio-Capture-APK
          path: x96-translate/android-capture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
